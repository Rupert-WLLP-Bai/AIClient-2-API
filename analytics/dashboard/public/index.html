<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>使用统计看板 - AIClient-2-API</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #fff;
        }

        .time-filter {
            display: flex;
            gap: 10px;
        }

        .time-filter button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            cursor: pointer;
            transition: all 0.3s;
        }

        .time-filter button:hover,
        .time-filter button.active {
            background: #4f46e5;
            color: #fff;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-card h3 {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
        }

        .stat-card .sub-value {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }

        .stat-card.success .value { color: #22c55e; }
        .stat-card.warning .value { color: #f59e0b; }
        .stat-card.error .value { color: #ef4444; }
        .stat-card.info .value { color: #3b82f6; }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 1024px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }

        .chart-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chart-card h3 {
            font-size: 16px;
            color: #fff;
            margin-bottom: 15px;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        .tables-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        @media (max-width: 1024px) {
            .tables-grid {
                grid-template-columns: 1fr;
            }
        }

        .table-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .table-card h3 {
            font-size: 16px;
            color: #fff;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 8px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            font-size: 12px;
            color: #9ca3af;
            font-weight: 500;
            text-transform: uppercase;
        }

        td {
            font-size: 14px;
            color: #e0e0e0;
        }

        .table-scroll {
            max-height: 400px;
            overflow-y: auto;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-success { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .badge-error { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .badge-warning { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .badge-info { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }

        .realtime-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .realtime-panel h3 {
            font-size: 16px;
            color: #fff;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .realtime-stats {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .realtime-stat {
            display: flex;
            flex-direction: column;
        }

        .realtime-stat .label {
            font-size: 12px;
            color: #9ca3af;
        }

        .realtime-stat .value {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            color: #9ca3af;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 15px;
            color: #ef4444;
            margin-bottom: 20px;
        }

        .uuid-short {
            font-family: monospace;
            font-size: 12px;
            color: #6b7280;
        }

        .cost-value {
            color: #22c55e;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 使用统计看板</h1>
            <div class="time-filter">
                <button class="active" data-range="1h">1小时</button>
                <button data-range="24h">24小时</button>
                <button data-range="7d">7天</button>
                <button data-range="30d">30天</button>
                <button data-range="all">全部</button>
            </div>
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span id="connection-status">已连接</span>
            </div>
        </header>

        <div id="error-container"></div>

        <!-- 实时监控面板 -->
        <div class="realtime-panel">
            <h3>
                <span class="status-dot"></span>
                实时监控
            </h3>
            <div class="realtime-stats">
                <div class="realtime-stat">
                    <span class="label">活跃请求</span>
                    <span class="value" id="pending-requests">0</span>
                </div>
                <div class="realtime-stat">
                    <span class="label">最近1分钟请求</span>
                    <span class="value" id="requests-last-minute">0</span>
                </div>
                <div class="realtime-stat">
                    <span class="label">最近1分钟错误</span>
                    <span class="value" id="errors-last-minute">0</span>
                </div>
                <div class="realtime-stat">
                    <span class="label">平均响应时间</span>
                    <span class="value" id="avg-response-time">0ms</span>
                </div>
                <div class="realtime-stat">
                    <span class="label">WebSocket 客户端</span>
                    <span class="value" id="connected-clients">0</span>
                </div>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-cards">
            <div class="stat-card">
                <h3>总请求数</h3>
                <div class="value" id="total-requests">-</div>
                <div class="sub-value" id="success-rate">-</div>
            </div>
            <div class="stat-card success">
                <h3>总 Tokens</h3>
                <div class="value" id="total-tokens">-</div>
                <div class="sub-value" id="tokens-breakdown">-</div>
            </div>
            <div class="stat-card info">
                <h3>总成本</h3>
                <div class="value" id="total-cost">-</div>
                <div class="sub-value">估算值（美元）</div>
            </div>
            <div class="stat-card warning">
                <h3>平均响应时间</h3>
                <div class="value" id="avg-response">-</div>
                <div class="sub-value">毫秒</div>
            </div>
            <div class="stat-card">
                <h3>活跃模型</h3>
                <div class="value" id="unique-models">-</div>
                <div class="sub-value" id="unique-providers">-</div>
            </div>
        </div>

        <!-- 图表区域 -->
        <div class="charts-grid">
            <div class="chart-card">
                <h3>模型使用分布</h3>
                <div class="chart-container">
                    <canvas id="model-chart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h3>Token 使用趋势</h3>
                <div class="chart-container">
                    <canvas id="token-chart"></canvas>
                </div>
            </div>
        </div>

        <!-- 表格区域 -->
        <div class="tables-grid">
            <div class="table-card">
                <h3>账号使用排行</h3>
                <div class="table-scroll">
                    <table>
                        <thead>
                            <tr>
                                <th>Provider</th>
                                <th>UUID</th>
                                <th>请求数</th>
                                <th>成功率</th>
                                <th>Tokens</th>
                                <th>成本</th>
                            </tr>
                        </thead>
                        <tbody id="provider-table">
                            <tr><td colspan="6" class="loading">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="table-card">
                <h3>最近请求</h3>
                <div class="table-scroll">
                    <table>
                        <thead>
                            <tr>
                                <th>时间</th>
                                <th>模型</th>
                                <th>状态</th>
                                <th>Tokens</th>
                                <th>耗时</th>
                            </tr>
                        </thead>
                        <tbody id="recent-table">
                            <tr><td colspan="5" class="loading">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
